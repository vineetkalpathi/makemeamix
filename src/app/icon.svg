<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    .disc   { fill: #1f1812; }
    .groove { stroke: #b39e84; }
    .accent { fill: #7e556e; }
    .label  { fill: #f3e8d1; }
    .arm    { stroke: #4a3a2c; fill: #4a3a2c; }
    @media (prefers-color-scheme: dark) {
      .disc   { fill: #f1e6cf; }
      .groove { stroke: #5d4e3c; }
      .accent { fill: #ad84a8; }
      .label  { fill: #1a130d; }
      .arm    { stroke: #c8b598; fill: #c8b598; }
    }
  </style>
  <circle class="disc" cx="18" cy="22" r="14" />
  <circle class="groove" cx="18" cy="22" r="10" fill="none" stroke-width="0.5" stroke-opacity="0.7" />
  <circle class="groove" cx="18" cy="22" r="7" fill="none" stroke-width="0.5" stroke-opacity="0.7" />
  <circle class="accent" cx="18" cy="22" r="4.2" />
  <circle class="label" cx="18" cy="22" r="0.8" />
  <g class="arm" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="32" y1="6" x2="22" y2="18" />
    <circle cx="33" cy="5" r="2.2" stroke="none" />
  </g>
</svg>
