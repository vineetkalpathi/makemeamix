<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    
    <radialGradient id="bgRose" cx="14%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#7a3848" stop-opacity="0.55"></stop>
      <stop offset="60%" stop-color="#7a3848" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bgMustard" cx="92%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#7a5e2a" stop-opacity="0.45"></stop>
      <stop offset="62%" stop-color="#7a5e2a" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bgTerra" cx="50%" cy="110%" r="55%">
      <stop offset="0%" stop-color="#a35438" stop-opacity="0.45"></stop>
      <stop offset="62%" stop-color="#a35438" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="disc" cx="50%" cy="42%" r="65%">
