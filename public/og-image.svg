<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    
    <radialGradient id="bgRose" cx="14%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#e9c8c0" stop-opacity="0.95"></stop>
      <stop offset="60%" stop-color="#e9c8c0" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bgMustard" cx="92%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#e8cf99" stop-opacity="0.85"></stop>
      <stop offset="62%" stop-color="#e8cf99" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bgTerra" cx="50%" cy="110%" r="55%">
      <stop offset="0%" stop-color="#d99479" stop-opacity="0.7"></stop>
